<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lite V.B - تحميل النسخة الآمنة</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f2f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            border: 1px solid #eef2f6;
        }

        .content {
            padding: 2rem 1.8rem;
            text-align: center;
        }

        .app-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 1rem;
            background: #f8fafc;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-name {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0a2540;
            margin-bottom: 0.5rem;
        }

        .app-name span {
            color: #2c7da0;
        }

        .badge {
            background: #e6f4ea;
            color: #2e7d5e;
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 0.95rem;
            color: #2c3e4e;
            background: #f9fbfd;
            padding: 1rem;
            border-radius: 20px;
            margin: 1rem 0 1.2rem;
        }

        .info-list {
            background: #ffffff;
            border-radius: 24px;
            margin: 1rem 0 1.5rem;
            border: 1px solid #ecf1f7;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #f0f4fa;
            font-size: 0.9rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #4b5e77;
        }

        .info-value {
            background: #f8fafc;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: #1877f2;
            padding: 0.9rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            text-decoration: none;
            margin: 0.8rem 0;
        }

        .btn-facebook {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: #0a66ff;
            padding: 0.9rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            text-decoration: none;
            margin-bottom: 0.8rem;
        }

        .footnote {
            font-size: 0.7rem;
            color: #7a8aa3;
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="content">

        <!-- صورة التطبيق -->
        <div class="app-icon">
            <img src="h.png" alt="Lite V.B Logo"
            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%231877f2%22/%3E%3Ctext x=%2250%22 y=%2267%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22%3ELV%3C/text%3E%3C/svg%3E';">
        </div>

        <div class="app-name">Lite <span>V.B</span></div>
        <div class="badge"><i class="fas fa-shield-alt"></i> نسخة آمنة ومعتمدة</div>

        <!-- النص كما هو بدون تعديل -->
        <div class="description">
            <i class="fas fa-wifi"></i> نسخة أمنة معدلة من فيسبوك لايت، تسمح للمستخدم باستخدام الوضع الأساسي دون إنترنت بكل سلاسة وأمان.
        </div>

        <div class="info-list">
            <div class="info-row">
                <span>الإصدار</span><span>1.0.0.2</span>
            </div>
            <div class="info-row">
                <span>حجم الملف</span><span>5 MB</span>
            </div>
            <div class="info-row">
                <span>نظام التشغيل</span><span>Android 5.0+</span>
            </div>
            <div class="info-row">
                <span>الميزة</span><span>وضع أساسي دون إنترنت</span>
            </div>
        </div>

        <!-- زر التحميل -->
        <a href="app.apk" download class="btn-download" id="downloadBtn">
            <i class="fas fa-download"></i> تحميل التطبيق
        </a>

        <!-- زر المطور تحت زر التحميل -->
        <a href="https://www.facebook.com/VH5FS" target="_blank" class="btn-facebook">
            <i class="fab fa-facebook"></i> صفحة المطور على فيسبوك
        </a>

        <div class="footnote">
            ملف APK آمن 100% • فعّل "مصادر غير معروفة" عند التثبيت
        </div>

    </div>
</div>

</body>
</html>
