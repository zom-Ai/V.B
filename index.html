<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>متجر التطبيقات - متجر عربي للتطبيقات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* الهيدر */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #5a6e8a;
            font-size: 1rem;
        }

        /* شريط البحث */
        .search-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .search-box {
            display: inline-flex;
            align-items: center;
            background: white;
            border-radius: 50px;
            padding: 5px 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: transparent;
        }

        .search-box button {
            background: #2a5298;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #1e3c72;
            transform: scale(1.02);
        }

        /* شبكة التطبيقات */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* بطاقة التطبيق */
        .app-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            text-align: center;
            padding-bottom: 15px;
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
        }

        .app-card-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .app-card h3 {
            font-size: 1rem;
            margin: 12px 10px 5px;
            color: #1e2a3e;
            font-weight: 600;
        }

        .app-card p {
            font-size: 0.8rem;
            color: #6c757d;
            margin-bottom: 8px;
        }

        /* مودال التفاصيل */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .modal-header h2 {
            margin-bottom: 5px;
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-img {
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-img img {
            width: 110px;
            height: 110px;
            border-radius: 25px;
            object-fit: cover;
            border: 3px solid #e9ecef;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eef2f6;
        }

        .detail-label {
            font-weight: 700;
            color: #2a5298;
        }

        .detail-value {
            color: #2c3e66;
            word-break: break-all;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .close-modal {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .close-modal:hover {
            background: #c82333;
        }

        /* حالة التحميل والخطأ */
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: #2a5298;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 20px;
            margin: 20px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #6c757d;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📱 متجر التطبيقات</h1>
        <p>اكتشف أفضل التطبيقات - حمل ما يناسبك</p>
    </div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن تطبيق..." aria-label="بحث">
            <button id="searchBtn">بحث</button>
        </div>
    </div>

    <div id="appsContainer" class="apps-grid">
        <div class="loading">⏳ جاري تحميل التطبيقات...</div>
    </div>
    <footer>
        متجر تطبيقات عربي | جميع الحقوق محفوظة © 2025
    </footer>
</div>

<!-- مودال التفاصيل -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalAppName">اسم التطبيق</h2>
            <small>معلومات التطبيق</small>
        </div>
        <div class="modal-body">
            <div class="modal-img">
                <img id="modalAppImage" src="" alt="صورة التطبيق">
            </div>
            <div class="detail-row">
                <span class="detail-label">📦 اسم الحزمة:</span>
                <span class="detail-value" id="modalPackage">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📌 الإصدار:</span>
                <span class="detail-value" id="modalVersion">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">👤 المطور:</span>
                <span class="detail-value" id="modalDeveloper">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">📁 ملف APK:</span>
                <span class="detail-value" id="modalApkFile">-</span>
            </div>
            <button id="downloadModalBtn" class="download-btn">📥 تحميل التطبيق</button>
            <button class="close-modal" id="closeModalBtn">إغلاق</button>
        </div>
    </div>
</div>

<script>
    // قائمة التطبيقات الأساسية (يتم تخزين أسمائها بعد قراءة A.txt)
    let appNamesList = [];       // يحتوي على أسماء ملفات التطبيقات مثل ['Facebook.txt', 'WhatsApp.txt']
    let appsData = new Map();    // خريطة لتخزين بيانات كل تطبيق (المفتاح: اسم التطبيق النظيف، القيمة: كائن البيانات)

    // عناصر DOM
    const appsContainer = document.getElementById('appsContainer');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const modal = document.getElementById('detailModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const downloadModalBtn = document.getElementById('downloadModalBtn');

    // متغيرات لتخزين التطبيق الحالي في المودال
    let currentAppData = null;
    let currentAppCleanName = '';

    // دالة لقراءة ملف A.txt (قائمة أسماء ملفات التطبيقات)
    async function fetchAppsList() {
        try {
            const response = await fetch('A.txt');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status} - تأكد من وجود ملف A.txt`);
            }
            const text = await response.text();
            // تقسيم النص إلى سطور، وتصفية الأسطر الفارغة وإزالة المسافات
            const lines = text.split(/\r?\n/);
            appNamesList = lines.filter(line => line.trim().length > 0).map(line => line.trim());
            
            if (appNamesList.length === 0) {
                appsContainer.innerHTML = '<div class="error-message">⚠️ ملف A.txt لا يحتوي على أي تطبيقات.</div>';
                return false;
            }
            return true;
        } catch (error) {
            console.error('خطأ في قراءة A.txt:', error);
            appsContainer.innerHTML = `<div class="error-message">❌ فشل تحميل قائمة التطبيقات: ${error.message}<br>تأكد من وجود ملف A.txt في نفس المسار.</div>`;
            return false;
        }
    }

    // دالة لقراءة ملف تطبيق فردي (مثل Facebook.txt) واستخراج البيانات
    async function fetchAppDetails(appFileName) {
        try {
            const response = await fetch(appFileName);
            if (!response.ok) {
                throw new Error(`لا يمكن قراءة ملف ${appFileName}`);
            }
            const content = await response.text();
            //解析格式:
            // اسم التطبيق Apk  مثلا Lite.apk 
            // اسم الحزمة مثلا com.lita...
            // الاصدار مثلا 1.1.1
            // اسم المطور مثلا  Omar 
            // صورة التطبيق مثلا 454842.png
            const lines = content.split(/\r?\n/);
            let apkFile = '', packageName = '', version = '', developer = '', imageFile = '';
            
            for (let line of lines) {
                line = line.trim();
                if (line === '') continue;
                
                // نبحث عن الكلمات المفتاحية المرنة: يمكن أن تحتوي على (Apk, apk, الحزمة, Package, الاصدار, Version, المطور, Developer, صورة, Image)
                // لكن نعتمد على التنسيق الموصوف: السطر الأول هو اسم ملف APK.
                // أفضل طريقة: تخزين الأسطر المتتالية حسب الترتيب المذكور في السؤال.
                // الترتيب: السطر1: اسم التطبيق Apk, السطر2: اسم الحزمة, السطر3: الاصدار, السطر4: اسم المطور, السطر5: صورة التطبيق
                // ولكن قد تكون هناك أسطر إضافية، نستخدم مؤشرات.
            }
            
            // طريقة أكثر أماناً: نقرأ الأسطر غير الفارغة ونحدد حسب السياق BUT دعنا نعتمد على التعريف الثابت حسب الوصف:
            // المستخدم قال التنسيق: 
            // اسم تطبيق.txt يحتوي على:
            // اسم التطبيق Apk  مثلا Lite.apk 
            // اسم الحزمة مثلا com.lita...
            // الاصدار مثلا 1.1.1
            // اسم المطور مثلا  Omar 
            // صورة التطبيق مثلا 454842.png
            const nonEmptyLines = lines.filter(l => l.trim().length > 0);
            if (nonEmptyLines.length >= 5) {
                apkFile = nonEmptyLines[0].trim();
                packageName = nonEmptyLines[1].trim();
                version = nonEmptyLines[2].trim();
                developer = nonEmptyLines[3].trim();
                imageFile = nonEmptyLines[4].trim();
            } else {
                // إذا كان الملف ناقصاً نحاول تعيين قيم افتراضية
                apkFile = nonEmptyLines[0] || 'unknown.apk';
                packageName = nonEmptyLines[1] || 'غير معروف';
                version = nonEmptyLines[2] || '1.0';
                developer = nonEmptyLines[3] || 'مطور عام';
                imageFile = nonEmptyLines[4] || 'default.png';
            }
            
            // استخراج اسم التطبيق النظيف من اسم الملف (إزالة .txt)
            const cleanAppName = appFileName.replace(/\.txt$/i, '');
            
            return {
                cleanName: cleanAppName,
                apkFile: apkFile,
                packageName: packageName,
                version: version,
                developer: developer,
                imageFile: imageFile,
                originalFileName: appFileName
            };
        } catch (error) {
            console.error(`خطأ في تحميل تفاصيل ${appFileName}:`, error);
            return null;
        }
    }

    // دالة تحميل جميع التطبيقات بالتوازي
    async function loadAllApps() {
        const listLoaded = await fetchAppsList();
        if (!listLoaded) return;
        
        appsContainer.innerHTML = '<div class="loading">📲 جاري تحميل بيانات التطبيقات...</div>';
        
        // تحميل تفاصيل كل تطبيق من ملفه
        const fetchPromises = appNamesList.map(async (appEntry) => {
            // appEntry هو اسم الملف مثلاً "Facebook.txt"
            const details = await fetchAppDetails(appEntry);
            if (details) {
                appsData.set(details.cleanName, details);
                return details;
            }
            return null;
        });
        
        const results = await Promise.all(fetchPromises);
        const successfulApps = results.filter(r => r !== null);
        
        if (successfulApps.length === 0) {
            appsContainer.innerHTML = '<div class="error-message">⚠️ لم يتم العثور على بيانات صالحة لأي تطبيق. تأكد من صيغة الملفات.</div>';
            return;
        }
        
        // عرض التطبيقات
        displayApps(successfulApps);
    }

    // عرض قائمة التطبيقات (مع دعم البحث)
    function displayApps(appsArray) {
        if (!appsArray || appsArray.length === 0) {
            appsContainer.innerHTML = '<div class="no-results">😓 لا توجد تطبيقات مطابقة للبحث.</div>';
            return;
        }
        
        appsContainer.innerHTML = '';
        appsArray.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.setAttribute('data-appname', app.cleanName);
            
            // تحديد مسار الصورة: نفترض أن الصور موجودة في نفس المجلد، يمكن إضافة مسار ثابت
            const imgSrc = app.imageFile || 'default-app.png';
            
            card.innerHTML = `
                <div class="app-card-img">
                    <img src="${imgSrc}" alt="${app.cleanName}" onerror="this.src='https://placehold.co/400x400?text=📱+No+Image'">
                </div>
                <h3>${escapeHtml(app.cleanName)}</h3>
                <p>${escapeHtml(app.developer) || 'مطور'}</p>
            `;
            
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(app.cleanName);
            });
            
            appsContainer.appendChild(card);
        });
    }
    
    // فتح نافذة التفاصيل
    function openModal(cleanAppName) {
        const app = appsData.get(cleanAppName);
        if (!app) return;
        
        currentAppData = app;
        currentAppCleanName = cleanAppName;
        
        document.getElementById('modalAppName').innerText = app.cleanName;
        document.getElementById('modalPackage').innerText = app.packageName;
        document.getElementById('modalVersion').innerText = app.version;
        document.getElementById('modalDeveloper').innerText = app.developer;
        document.getElementById('modalApkFile').innerText = app.apkFile;
        
        const modalImg = document.getElementById('modalAppImage');
        modalImg.src = app.imageFile || 'default.png';
        modalImg.onerror = () => { modalImg.src = 'https://placehold.co/200x200?text=No+Image'; };
        
        modal.classList.add('active');
    }
    
    // دالة تنزيل ملف APK
    function downloadApk(apkFileName) {
        if (!apkFileName) {
            alert('لا يوجد رابط تحميل متاح لهذا التطبيق.');
            return;
        }
        // إنشاء رابط وهمي للتحميل (نفترض أن ملفات apk موجودة في نفس المسار)
        const link = document.createElement('a');
        link.href = apkFileName;
        link.download = apkFileName; // اقتراح اسم الملف
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    // البحث في التطبيقات
    function searchApps(query) {
        if (!query.trim()) {
            // إذا كان البحث فارغاً نعرض كل التطبيقات
            const allApps = Array.from(appsData.values());
            displayApps(allApps);
            return;
        }
        
        const lowerQuery = query.toLowerCase().trim();
        const filtered = Array.from(appsData.values()).filter(app => 
            app.cleanName.toLowerCase().includes(lowerQuery) || 
            app.developer.toLowerCase().includes(lowerQuery) ||
            app.packageName.toLowerCase().includes(lowerQuery)
        );
        displayApps(filtered);
    }
    
    // مساعد لتفادي XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // أحداث البحث
    searchBtn.addEventListener('click', () => {
        searchApps(searchInput.value);
    });
    
    searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            searchApps(searchInput.value);
        }
    });
    
    // إغلاق المودال
    function closeModal() {
        modal.classList.remove('active');
        currentAppData = null;
    }
    
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    
    // زر التحميل داخل المودال
    downloadModalBtn.addEventListener('click', () => {
        if (currentAppData && currentAppData.apkFile) {
            downloadApk(currentAppData.apkFile);
        } else {
            alert('لا يتوفر رابط التحميل لهذا التطبيق.');
        }
    });
    
    // بدء تحميل الصفحة
    loadAllApps();
</script>
</body>
</html>
